# layout1 scaled for 1366x768 (original designed for 1920x1080, scale ~0.71)
# Fixes: hardcoded /home/mahaveer wall path, AlfaSlabOne font missing, off-screen battery widgets

$fn_greet=echo "<i> Hi $USER :) </i>"
$wall = $HOME/.config/hyprlock/wallpapers/4.jpg

# GENERAL
general {
  no_fade_in = true
  grace = 1
  disable_loading_bar = false
  hide_cursor = true
  ignore_empty_input = true
  text_trim = true
}

# BACKGROUND
background {
    monitor =
    path = $wall
    blur_passes = 2
    contrast = 0.8916
    brightness = 0.7172
    vibrancy = 0.1696
    vibrancy_darkness = 0
}

# TIME HR
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%H")"
    color = $p1_accent_4_rgba
    shadow_size = 3
    shadow_color = rgb(0,0,0)
    shadow_boost = 1.2
    font_size = 107
    font_family = JetBrainsMono Nerd Font
    position = 0, -178
    halign = center
    valign = top
    zindex = 5
}

# TIME MIN
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%M")"
    color = $primary_3_rgba
    font_size = 107
    font_family = JetBrainsMono Nerd Font
    position = 0, -299
    halign = center
    valign = top
    zindex = 5
}

# DATE
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%d %b %A")"
    color = $p3_accent_6_rgba
    font_size = 14
    font_family = JetBrains Mono Nerd Font Mono ExtraBold
    position = 0, -92
    halign = center
    valign = center
    zindex = 5
}

# INPUT FIELD
input-field {
    monitor =
    size = 200, 50
    outline_thickness = 1
    outer_color = rgba(0, 0, 0, 0)
    dots_size = 0.1
    dots_spacing = 1
    dots_center = true
    inner_color = $primary_7_rgba
    font_color = rgba(200, 200, 200, 0.5)
    fade_on_empty = false
    placeholder_text =<i>Hii $USER ;) </i>
    hide_input = false
    position = 0, -156
    halign = center
    valign = center
    zindex = 20
}

# Battery
label {
    monitor =
    text = cmd[update:1000] echo -e "$($battery)"
    color = rgba(200, 200, 200, 0.5)
    font_size = 12
    font_family = JetBrains Mono Nerd Font Mono ExtraBold
    position = -20, -363
    halign = right
    valign = center
    zindex = 5
}

# Battery div
shape {
    monitor =
    size = 50, 25
    color = $primary_7_rgba
    rounding = 10
    rotate = 0
    position = 643, 9
    halign = center
    valign = bottom
    zindex = 1
}
