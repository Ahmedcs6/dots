# layout13 scaled for 1366x768 (original designed for 1920x1080, scale ~0.71)
# Original: layout13.conf | Font replaced: TeachingPrintDotted-OVKlp -> JetBrainsMono Nerd Font (not installed)

$wall = $HOME/.config/hyprlock/wallpapers/8.png

# BACKGROUND
background {
    monitor =
    path = $wall
    blur_passes = 1
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.8916
    vibrancy_darkness = 0.0
}

# GENERAL
general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = false
}

# Time hour
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +"%I")</span>"
    color = rgb(173, 48, 49)
    font_size = 43
    font_family = JetBrainsMono Nerd Font
    position = -20, 285
    halign = center
    valign = center
}

# Time minutes
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +":%M")</span>"
    color = rgb(214, 209, 209)
    font_size = 43
    font_family = JetBrainsMono Nerd Font
    position = 57, 285
    halign = center
    valign = center
}

# Day-Month-Date
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%A, %B %d")"
    color = rgb(200, 200, 200)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 25, 242
    halign = center
    valign = center
}

# Profile-Photo
image {
    monitor =
    path = ~/.config/hyprlock/wallpapers/user.jpg
    border_size = 2
    border_color = rgb(173, 48, 49)
    size = 156
    rounding = 25
    rotate = 0
    reload_time = -1
    reload_cmd =
    position = 18, 64
    halign = center
    valign = center
}

# USER-BOX
shape {
    monitor =
    size = 250, 50
    color = rgb(173, 48, 49)
    rounding = -1
    border_size = 0
    border_color = rgba(255, 255, 255, 1)
    rotate = 0
    xray = false
    position = 24, -100
    halign = center
    valign = center
}

# USER
label {
    monitor =
    text = $USER
    color = rgba(216, 222, 233, 0.80)
    outline_thickness = 0
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = 27, -100
    halign = center
    valign = center
    zindex = 1
}

# INPUT FIELD
input-field {
    monitor =
    size = 250, 50
    outline_thickness = 0
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(255, 255, 255, 0)
    inner_color = rgb(173, 48, 49)
    font_color = rgb(200, 200, 200)
    fade_on_empty = false
    placeholder_text = <i><span foreground="##ffffff99">   Enter Pass</span></i>
    hide_input = false
    position = 24, -156
    halign = center
    valign = center
}

# bottom circle
shape {
    monitor =
    size = 46, 46
    color = rgb(255, 254, 254)
    rounding = -1
    border_size = 0
    border_color = rgba(255, 255, 255, 1)
    rotate = 0
    xray = false
    position = 24, -228
    halign = center
    valign = center
}

label {
    monitor =
    text = ⠶>
    color = rgb(173, 48, 49)
    font_size = 18
    position = 27, -228
    halign = center
    valign = center
    zindex = 1
}
