# Adapted from https://github.com/karanx64/haishi (.config/hypr/hyprlock.conf).
# Changes vs upstream (kept look identical):
# - background/image paths point at local files (upstream hardcodes
#   ~/Pictures/wallpapers/... which doesn't exist here)
# - $light1 -> $text ($light1 isn't defined in mocha.conf)
# - rgba($textAlphaXX) -> rgba(cdd6f4XX) (hyprlang has no $var+suffix
#   concatenation; $textAlpha33 etc. don't exist — same bug class as the
#   old $mauveAlpha00 one)
# - old split entry (colors + layouts/layout1-1366x768) backed up to
#   hyprlock.conf.pre-haishi.bak
#
# shortcuts to clear password buffer: ESC, Ctrl+U, Ctrl+Backspace

# uncomment to enable fingerprint authentication
# auth {
#     fingerprint {
#         enabled = true
#         ready_message = Scan fingerprint to unlock
#         present_message = Scanning...
#         retry_delay = 250 # in milliseconds
#     }
# }

$font = JetBrainsMono Nerd Font Propo
source = mocha.conf

general {
    hide_cursor = false
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = /home/ahmed/.config/hypr/bg/blue-clouds.png
    blur_passes = 5
    blur_size = 5
}
# Profile Picture
image {
    monitor =
    path = /home/ahmed/.config/hyprlock/wallpapers/user.jpg
    size = 100
    border_size = 10
    border_color = rgba(cdd6f433)
    position = 0, 200
    halign = center
    valign = bottom
}


#user
label {
    monitor =
    # text = cmd[update:1000] whoami
    text = $USER
    font_family = $font
    color = $text
    position = 0, 160
    halign = center
    valign = bottom
}

input-field {
    monitor =
    size = 200, 30
    outline_thickness = 3
    inner_color = rgba(cdd6f433)

    # outer_color = $green $sapphire 30deg
    # check_color = $red $peach 120deg
    # fail_color = $red $peach 30deg

    outer_color = rgba(cdd6f433)
    check_color = $red
    fail_color = $red

    font_color = rgba(cdd6f499)
    fade_on_empty = false
    rounding = 15

    font_family = $font
    placeholder_text =
    fail_text =

    # uncomment to use a letter instead of a dot to indicate the typed password
    # dots_text_format = *
    dots_size = 0.4
    dots_spacing = 0.3

    # uncomment to use an input indicator that does not show the password length (similar to swaylock's input indicator)
    # hide_input = true

    position = 0, 80
    halign = center
    valign = bottom
}



# TIME
label {
    monitor =
    text = cmd[update:1]  date +"%l:%M"
    font_size = 120
    font_family = $font black
    position = 0, -200
    halign = center
    valign = top
    color = rgba(cdd6f455)
}

# day
label {
    monitor =
    text = cmd[update:1] date +"%a"
    font_size = 16
    font_family = $font
    position = -150, -380
    halign = center
    valign = top
    color = $text
}

#separator
label {
    monitor =
    text = 
    font_size = 14
    font_family = $font
    position = -100, -382
    halign = center
    valign = top
    color=$red
}

# date
label {
    monitor =
    text = cmd[update:1] date +"%e"
    font_size = 16
    font_family = $font
    position = -50, -380
    halign = center
    valign = top
    color = $text
}
#separator
label {
    monitor =
    text = 
    font_size = 14
    font_family = $font
    position = 0, -382
    halign = center
    valign = top
    color=$green
}

# month
label {
    monitor =
    text = cmd[update:1] date +"%b"
    font_size = 16
    font_family = $font
    position = 50, -380
    halign = center
    valign = top
    color = $text
}
#separator
label {
    monitor =
    text = 
    font_size = 14
    font_family = $font
    position = 100, -382
    halign = center
    valign = top
    color=$blue
}
# Year
label {
    monitor =
    text = cmd[update:1] date +"%Y"
    font_size = 16
    font_family = $font
    position = 150, -380
    halign = center
    valign = top
    color = $text
}
